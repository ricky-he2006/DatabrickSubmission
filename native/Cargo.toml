[package]
name = "shopping-sessions"
version = "0.5.0"
edition = "2024"

[dependencies]
memmap2 = "=0.9.5"
memchr = "=2.7.4"
rayon = "=1.10.0"
serde_json = "=1.0.140"
parquet = { version = "=54.3.1", default-features = false }
rustc-hash = "=2.1.1"
mimalloc = { version = "=0.1.46", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

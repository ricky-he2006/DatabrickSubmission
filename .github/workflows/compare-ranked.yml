name: Profile ranked Shopping Sessions engine
on:
  push:
    branches: [larp/compare-ranked]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        events: [20000000, 60000000]
    env:
      EVENTS: ${{ matrix.events }}
      RANKED: ddf01a25268b146b6c6b1bd3a2fc41b90525e4fb
      CANDIDATE: 6b26052156409cecb7f789d8be4101ccc005f33f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check CPU and build the two submission images
        run: |
          lscpu | grep -E '^Model name|^CPU\(s\)|^Thread'
          grep -qw avx512bw /proc/cpuinfo
          for label in ranked; do
            sha=$CANDIDATE
            if [ "$label" = ranked ]; then sha=$RANKED; fi
            mkdir "$RUNNER_TEMP/$label-src"
            git archive "$sha" | tar -x -C "$RUNNER_TEMP/$label-src"
            docker build -q -t "$label" "$RUNNER_TEMP/$label-src"
            cid=$(docker create "$label")
            docker cp "$cid:/app/shopping-sessions" "$RUNNER_TEMP/$label"
            docker rm "$cid"
          done
      - name: Generate fresh data
        run: |
          git archive d656f21038990d5725563cd6729ad98b3f7057d1 pgo-generator | tar -x -C "$RUNNER_TEMP"
          cargo run --locked --release --manifest-path "$RUNNER_TEMP/pgo-generator/Cargo.toml" -- \
            --seed 7319 --events "$EVENTS" --clicks "$(( EVENTS / 4 ))" --threads "$(nproc)" --output "$RUNNER_TEMP/data"
          python -m pip install --quiet duckdb==1.4.5
      - name: Profile and tune the ranked binary
        shell: python
        run: |
          import os, pathlib, random, shutil, statistics, subprocess, time
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          workers = min(len(os.sched_getaffinity(0)), 8)
          data, output = root / "data", root / "out"
          env = dict(os.environ, NCPU=str(workers), DATA_DIR=str(data), OUTPUT_DIR=str(output))
          output.mkdir()
          subprocess.run([root / "ranked"], env=dict(env, XL_TIMING="1"), check=True)
          cases = {"default": {}, "read512": {"XL_RD":"512"}, "read2048": {"XL_RD":"2048"},
                   "release": {"XL_REL":"1","XL_FREE":"1","XL_ENDREL":"2"},
                   "release_end": {"XL_ENDREL":"2"}, "prefetch": {"XL_PF":"1"},
                   "no_prefault":{"XL_PREFAULT":"0","XL_POPW":"0"}, "cached_stores":{"XL_NT":"0"},
                   "chunk1":{"XL_CH":"1024"}, "chunk2":{"XL_CH":"2048"}, "nopin":{"XL_PIN":"0"},
                   "no_spin":{"XL_SPIN":"0"}, "read512_chunk2":{"XL_RD":"512","XL_CH":"2048"}}
          times = {k:[] for k in cases}
          rng = random.Random(18)
          for i in range(5):
              order=list(cases)
              rng.shuffle(order)
              for name in order:
                  shutil.rmtree(output)
                  output.mkdir()
                  start=time.perf_counter()
                  subprocess.run([root/"ranked"],env=dict(env, **cases[name]), check=True)
                  times[name].append(time.perf_counter()-start)
          for name, samples in sorted(times.items(), key=lambda p:statistics.median(p[1])):
              print("RESULT",name,round(statistics.median(samples),5),samples)

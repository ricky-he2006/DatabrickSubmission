name: Compare ranked Shopping Sessions entry
on:
  push:
    branches: [larp/compare-ranked]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        events: [20000000]
    env:
      EVENTS: ${{ matrix.events }}
      RANKED: ddf01a25268b146b6c6b1bd3a2fc41b90525e4fb
      CANDIDATE: 754567a10bb9204b960bd85d36dad412808fb495
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check CPU and build the two submission images
        run: |
          lscpu | grep -E '^Model name|^CPU\(s\)|^Thread'
          grep -qw avx512bw /proc/cpuinfo
          for label in ranked candidate; do
            sha=$CANDIDATE
            if [ "$label" = ranked ]; then sha=$RANKED; fi
            mkdir "$RUNNER_TEMP/$label-src"
            git archive "$sha" | tar -x -C "$RUNNER_TEMP/$label-src"
            docker build --build-arg TRAIN_PROFILE=0 --progress=plain -t "$label" "$RUNNER_TEMP/$label-src"
            cid=$(docker create "$label")
            docker cp "$cid:/app/shopping-sessions" "$RUNNER_TEMP/$label"
            docker rm "$cid"
          done
      - name: Generate fresh data
        run: |
          git archive d656f21038990d5725563cd6729ad98b3f7057d1 pgo-generator | tar -x -C "$RUNNER_TEMP"
          cargo run --locked --release --manifest-path "$RUNNER_TEMP/pgo-generator/Cargo.toml" -- \
            --seed 4531 --events "$EVENTS" --clicks "$(( EVENTS / 4 ))" --threads "$(nproc)" --output "$RUNNER_TEMP/data"
          python -m pip install --quiet duckdb==1.4.5
      - name: Alternate process-start-to-exit runs and compare all Parquet rows
        shell: python
        run: |
          import os, pathlib, shutil, statistics, subprocess, time
          import duckdb

          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          cpus = len(os.sched_getaffinity(0))
          workers = min(cpus, 8)
          print(f"Available CPUs {cpus}, workers {workers}", flush=True)
          labels = ["ranked", "candidate"]
          samples = {label: [] for label in labels}
          scratch = root / "scratch"
          scratch.mkdir()
          import random
          cases = {"ranked": {}, "candidate": {}, "indexed": {"XL_INDEX_ROWS":"1"},
                   "populate":{"XL_POPULATE_INPUT":"1"}, "click_index":{"XL_CKIX":"1"},
                   "click_parts":{"XL_CKIX":"2"}, "teardown":{"XL_ENDREL":"2"},
                   "long_prefetch":{"XL_PF":"1","XL_ENDREL":"2"}}
          samples = {label:[] for label in cases}
          rng=random.Random(43)
          for round_number in range(6):
              order=list(cases)
              rng.shuffle(order)
              for label in order:
                  output = root / (label + "-out")
                  if output.exists():
                      shutil.rmtree(output)
                  output.mkdir()
                  env = dict(os.environ, DATA_DIR=str(root / "data"), OUTPUT_DIR=str(output),
                             SCRATCH_DIR=str(scratch), NCPU=str(workers), **cases[label])
                  start = time.perf_counter()
                  subprocess.run([str(root / ("ranked" if label=="ranked" else "candidate"))], env=env, check=True)
                  seconds = time.perf_counter() - start
                  if round_number:
                      samples[label].append(seconds)
          for name, values in samples.items():
              print("RESULT",name,statistics.median(values),values,flush=True)
          for table in ["user_daily", "campaign_daily"]:
              a=f"SELECT * FROM read_parquet('{root}/ranked-out/{table}/*.parquet')"
              for label in cases:
                  if label=="ranked": continue
                  b=f"SELECT * FROM read_parquet('{root}/{label}-out/{table}/*.parquet')"
                  for lhs,rhs in [(a,b),(b,a)]:
                      if duckdb.sql(f"SELECT count(*) FROM ({lhs} EXCEPT ALL {rhs})").fetchone()[0]:
                          raise ValueError(f"{label}: different {table}")

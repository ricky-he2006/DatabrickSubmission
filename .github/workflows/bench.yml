# Benchmarks on an x86 Linux runner. Runs only on the `bench` branch; nothing
# here is part of the submission.
name: bench
on:
  push:
    branches: [bench]
  workflow_dispatch:
jobs:
  bench:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Machine
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|Core|L1d|L2|L3|Flags" | sed 's/Flags.*avx512/Flags: has avx512/' | cut -c1-200
          cat /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/defrag
          free -g | head -2; uname -r; rustc --version
      - name: Dataset cache
        id: data
        uses: actions/cache@v4
        with:
          path: data-cache
          key: shopping-sessions-data-seed7-20m-v1
      - name: Generate dataset
        if: steps.data.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o generator.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          unzip -q generator.zip -d gen && (cd gen/generator && cargo build --release 2>&1 | tail -1)
          gen/generator/target/release/generate --seed 7 --events 20000000 --clicks 5000000 --output data-cache/d20
      - name: Benchmark
        run: bash bench/run.sh

  bench60:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Machine
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|L2|L3" | cut -c1-200
          free -g | head -2; df -h /dev/shm . | cat
      - name: Dataset cache
        id: data
        uses: actions/cache@v4
        with:
          path: data-cache
          key: shopping-sessions-data-seed7-60m-v2
      - name: Generate dataset
        if: steps.data.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o generator.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          unzip -q generator.zip -d gen && (cd gen/generator && cargo build --release 2>&1 | tail -1)
          gen/generator/target/release/generate --seed 7 --events 60000000 --clicks 15000000 --output data-cache/d60
          du -sh data-cache/d60
      - name: Benchmark
        run: DATA=d60 CASES=bench/cases60.txt RUNS=3 bash bench/run.sh

  profile:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Profile
        run: |
          sudo apt-get install -y -qq valgrind >/dev/null 2>&1
          curl -fsSL -o generator.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          unzip -q generator.zip -d gen && (cd gen/generator && cargo build --release 2>&1 | tail -1)
          gen/generator/target/release/generate --seed 7 --events 2000000 --clicks 500000 --output /dev/shm/d2
          cd native
          RUSTFLAGS="-C target-cpu=x86-64-v3" CARGO_PROFILE_RELEASE_DEBUG=true CARGO_PROFILE_RELEASE_STRIP=false cargo build --release 2>&1 | tail -1
          mkdir -p /dev/shm/o
          DATA_DIR=/dev/shm/d2 OUTPUT_DIR=/dev/shm/o NCPU=1 SS_RELEASE=0 valgrind --tool=callgrind --dump-instr=no --callgrind-out-file=/tmp/cg.out target/release/shopping-sessions 2>&1 | tail -5
          callgrind_annotate --auto=yes --threshold=99.9 /tmp/cg.out src/main.rs src/scan.rs src/ts.rs src/keys.rs src/pq.rs > /tmp/ann.txt 2>&1 || true
          grep -E "PROGRAM TOTALS" /tmp/ann.txt
          grep -n -E "^-- (Auto|User)-annotated source|^ *[0-9]{1,3},[0-9]{3},[0-9]{3} \\(" /tmp/ann.txt | grep -v "file:function" | cut -c1-210

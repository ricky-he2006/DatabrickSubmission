# Benchmarks on an x86 Linux runner. Runs only on the `bench` branch; nothing
# here is part of the submission.
name: bench
on:
  push:
    branches: [bench]
  workflow_dispatch:
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Machine
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|Core|L1d|L2|L3|Flags" | sed 's/Flags.*avx512/Flags: has avx512/' | cut -c1-200
          cat /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/defrag
          free -g | head -2; uname -r; rustc --version
      - name: Dataset cache
        id: data
        uses: actions/cache@v4
        with:
          path: data-cache
          key: shopping-sessions-data-seed7-20m-v1
      - name: Generate dataset
        if: steps.data.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o generator.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          unzip -q generator.zip -d gen && (cd gen/generator && cargo build --release 2>&1 | tail -1)
          gen/generator/target/release/generate --seed 7 --events 20000000 --clicks 5000000 --output data-cache/d20
      - name: Benchmark
        run: bash bench/run.sh
